# Blueprint do Render — https://render.com/docs/blueprint-spec
# No painel do Render: New → Blueprint → selecione este repositório.
# Os valores de GOOGLE_SHEET_ID e GOOGLE_SERVICE_ACCOUNT_JSON são pedidos na criação (sync: false).
services:
  - type: web
    name: painel-disparos
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free = dorme após ~15 min sem acesso (primeiro acesso demora). Troque para "starter" para ficar sempre ligado.
    plan: free
    # O Render não tem região no Brasil; Virginia costuma ter a menor latência a partir daqui.
    region: virginia
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Armazenamento: "sheets" (Google Planilhas) ou "airtable"
      - key: DATA_BACKEND
        value: sheets
      # ID da planilha (trecho da URL entre /d/ e /edit)
      - key: GOOGLE_SHEET_ID
        sync: false
      # Conteúdo completo do arquivo JSON da chave da conta de serviço
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_TAB
        value: Disparos
      - key: PORT
        value: "8080"
